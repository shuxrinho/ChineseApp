import java.util.Properties

plugins {
    alias(libs.plugins.android.application)
}

def localProps = new Properties()
def localPropsFile = rootProject.file("local.properties")
if (localPropsFile.exists()) {
    localPropsFile.withInputStream { stream ->
        localProps.load(stream)
    }
}
def supabaseUrl = localProps.getProperty("SUPABASE_URL", "")
def supabaseAnonKey = localProps.getProperty("SUPABASE_ANON_KEY", "")

android {
    namespace 'com.example.chineseapp'
    compileSdk 36

    defaultConfig {
        applicationId "com.example.chineseapp"
        minSdk 24
        targetSdk 36
        versionCode 1
        versionName "1.0"
        buildConfigField "String", "SUPABASE_URL", "\"${supabaseUrl}\""
        buildConfigField "String", "SUPABASE_ANON_KEY", "\"${supabaseAnonKey}\""

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildFeatures {
        viewBinding true
        buildConfig true
    }
}

dependencies {

    implementation libs.appcompat
    implementation libs.material
    implementation libs.activity
    implementation libs.constraintlayout
    implementation libs.work.runtime
    implementation libs.firebase.crashlytics.buildtools
    implementation 'com.google.code.gson:gson:2.10.1'
    implementation libs.navigation.fragment
    implementation libs.navigation.ui
    implementation libs.glide
    implementation libs.androidx.activity
    testImplementation libs.junit
    androidTestImplementation libs.ext.junit
    implementation "androidx.room:room-runtime:2.6.1"
    annotationProcessor "androidx.room:room-compiler:2.6.1"
    implementation "androidx.datastore:datastore-preferences:1.1.1"
    implementation "com.google.guava:guava:32.1.3-android"
    implementation "com.squareup.okhttp3:okhttp:4.12.0"

}
